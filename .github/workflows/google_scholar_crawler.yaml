name: Get Citation Data

permissions:
  contents: write

# Citation fetching is manual-only; automatic triggers are disabled.
on:
  workflow_dispatch:

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Read Scholar profile
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      # These steps run only after a complete, successful fetch and parse.
      - uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Publish successful snapshot
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cp google_scholar_crawler/results/*.json citation-data/
          cd citation-data
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Scholar citation snapshot"
          git push origin HEAD:google-scholar-stats
